name: Pre-release guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block staging configuration
        run: node scripts/pre-release-check.js
